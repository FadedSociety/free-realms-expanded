[package]
name = "osfr-tools"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local inspection and extraction of the supplied Free Realms asset packs"
default-run = "osfr-tools"

[dependencies]
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
getrandom = "0.2.17"
subtle = "2.6"
