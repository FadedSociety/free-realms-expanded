<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Realm admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2352d18e'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%230e1113'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="boot" id="boot">Loading the admin panel</div>

  <main class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span><span>Realm admin</span></div>
      <p class="muted">Sign in with your launcher key. It is used here to sign, and never leaves this page.</p>
      <label class="field"><span>Account</span><input name="account" autocomplete="username" maxlength="64" required placeholder="Your launcher account handle"></label>
      <label class="field"><span>Key file</span><input name="key" type="file" accept=".ed25519"></label>
      <p class="muted small">The file is <strong>key.ed25519</strong> in your launcher profile folder, under %APPDATA%\FreeRealmsExpanded\profiles.</p>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <p class="muted small">Moderators and admins only.</p>
    </form>
  </main>

  <div class="shell" id="shell" hidden>
    <nav class="sidebar" id="sidebar" aria-label="Sections">
      <a class="brand" href="#/dashboard"><span class="brand-mark" aria-hidden="true"></span><span>Realm admin</span></a>
      <ul class="nav" id="nav"></ul>
      <div class="sidebar-foot">
        <button class="nav-cmd" type="button" data-cmdk>Command bar <kbd>Ctrl K</kbd></button>
      </div>
    </nav>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content" id="content" tabindex="-1"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
